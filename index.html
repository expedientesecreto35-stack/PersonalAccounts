<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F1F5F4" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0C1513" media="(prefers-color-scheme: dark)"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cuentas del Mes</title>
<style>
/* Cuentas del Mes — Rediseño Dinámico "Pulse Deck" (v4)
   Arquitectura renovada:
   - Header inmersivo adaptativo con Gauge semicircular de uso del mes
   - Modo Privacidad (blur instantáneo de montos)
   - Carrusel horizontal de tarjetas-bolsillo (scroll-snap)
   - Barra inferior con botón central "+" integrado (móvil) y Top-Nav SaaS (PC)
   - Timeline de actividad reciente, gráfico con controles colapsables y animaciones escalonadas */
:root{
  --bg:#F0F3F8; --surface:#FFFFFF; --surface2:#E6EBF3; --ink:#0F172A; --muted:#5B677A; --line:#DCE3EE;
  --accent:#2563EB; --on-accent:#FFFFFF; --accent-tint:#DBEAFE;
  --out:#F97316; --c3:#8B5CF6;
  --usdt:#059669; --usdt-bg:#D1FAE5; --bcv:#2563EB; --bcv-bg:#DBEAFE; --bs:#D97706; --bs-bg:#FEF3C7;
  --ok:#059669; --ok-bg:#D1FAE5; --warn:#D97706; --warn-bg:#FEF3C7; --bad:#E11D48; --bad-bg:#FFE4E6; --idle:#5B677A; --idle-bg:#E6EBF3;
  --scrim:rgb(15 23 42 / .56);
  --shadow:0 12px 32px -6px rgb(15 23 42 / .18), 0 4px 12px rgb(15 23 42 / .08);
  --card-shadow:0 2px 6px rgb(15 23 42 / .04), 0 10px 24px -12px rgb(15 23 42 / .09);
  --font-body:'Plus Jakarta Sans','Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-num:'JetBrains Mono','Spline Sans Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --r-card:22px; --r-btn:14px; --r-in:12px; --r-sheet:26px; --r-md:16px; --r-seg:10px;
  --gap:15px; --cpy:18px; --cpx:18px; --rpy:13px; --rpx:16px; --spy:10px;
  --app-name:"Cuentas del Mes";
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070B14; --surface:#101726; --surface2:#182235; --ink:#F1F5F9; --muted:#94A3B8; --line:#1E2A40;
    --accent:#38BDF8; --on-accent:#06121F; --accent-tint:#0C2D48;
    --out:#FB923C; --c3:#A78BFA;
    --usdt:#34D399; --usdt-bg:#064E3B; --bcv:#60A5FA; --bcv-bg:#1E3A8A; --bs:#FBBF24; --bs-bg:#451A03;
    --ok:#34D399; --ok-bg:#052E24; --warn:#FBBF24; --warn-bg:#3B2305; --bad:#FB7185; --bad-bg:#3F0F1B; --idle:#94A3B8; --idle-bg:#182235;
    --scrim:rgb(0 0 0 / .72);
    --shadow:0 16px 44px -8px rgb(0 0 0 / .75);
    --card-shadow:0 2px 6px rgb(0 0 0 / .4), inset 0 1px 0 rgb(255 255 255 / .045);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070B14; --surface:#101726; --surface2:#182235; --ink:#F1F5F9; --muted:#94A3B8; --line:#1E2A40;
  --accent:#38BDF8; --on-accent:#06121F; --accent-tint:#0C2D48;
  --out:#FB923C; --c3:#A78BFA;
  --usdt:#34D399; --usdt-bg:#064E3B; --bcv:#60A5FA; --bcv-bg:#1E3A8A; --bs:#FBBF24; --bs-bg:#451A03;
  --ok:#34D399; --ok-bg:#052E24; --warn:#FBBF24; --warn-bg:#3B2305; --bad:#FB7185; --bad-bg:#3F0F1B; --idle:#94A3B8; --idle-bg:#182235;
  --scrim:rgb(0 0 0 / .72);
  --shadow:0 16px 44px -8px rgb(0 0 0 / .75);
  --card-shadow:0 2px 6px rgb(0 0 0 / .4), inset 0 1px 0 rgb(255 255 255 / .045);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg);
  background-image:
    radial-gradient(circle 420px at 10% -5%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%),
    radial-gradient(circle 360px at 95% 8%, color-mix(in srgb, var(--c3) 10%, transparent), transparent 70%);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--font-body);
  font-size:.9375rem;line-height:1.48;-webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
h2{font-size:1.04rem;font-weight:750;letter-spacing:-.02em;text-wrap:balance}
h3{font-size:.96rem;font-weight:680}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.025em;transition:filter .25s var(--ease)}
.muted{color:var(--muted)}

/* Modo Privacidad: difumina montos con un clic y los revela al pasar el mouse/tocar */
body.priv .num, body.priv .ch-big, body.priv .ch-v{filter:blur(7px);user-select:none}
body.priv .num:hover, body.priv .num:active{filter:none}

/* ---------- animación escalonada dinámica al entrar ---------- */
@keyframes riseIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
#view>*{animation:riseIn .32s var(--ease) both}
#view>*:nth-child(2){animation-delay:.04s}
#view>*:nth-child(3){animation-delay:.08s}
#view>*:nth-child(4){animation-delay:.12s}
#view>*:nth-child(5){animation-delay:.16s}
#view>*:nth-child(6){animation-delay:.20s}

/* ---------- estructura y barra superior ---------- */
.app{max-width:560px;margin-inline:auto;padding-inline:16px;padding-block:0 120px}
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:15;
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 16px;margin-inline:-16px;margin-bottom:8px;
}
.month{
  display:inline-flex;align-items:center;gap:2px;flex:none;
  background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:3px 5px;box-shadow:var(--card-shadow);
}
.mlabel{display:flex;flex-direction:column;align-items:center;min-width:0;padding-inline:8px}
.mlabel strong{font-size:.95rem;font-weight:750;letter-spacing:-.02em;line-height:1.15;white-space:nowrap}
.top-r{display:flex;align-items:center;gap:6px;min-width:0}
.priv-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:none;
  box-shadow:var(--card-shadow);transition:transform .15s var(--spring), background .15s, border-color .15s;
}
.priv-btn:active{transform:scale(.88)}
.priv-btn.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.link{background:none;border:0;padding:0;color:var(--accent);font-size:.76rem;font-weight:700;text-decoration:none}
.link:hover{text-decoration:underline}
.icon{width:32px;height:32px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink);transition:background .14s, transform .14s var(--spring)}
.icon:active{background:var(--surface2);transform:scale(.86)}
.status{
  font-size:.7rem;font-weight:650;color:var(--muted);
  display:inline-flex;align-items:center;gap:6px;min-width:0;line-height:1.2;text-align:right;
  padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--card-shadow);max-width:155px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;flex:none}
.status.saving i{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
.status.error i{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}

/* ---------- tarjetas ---------- */
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  padding:var(--cpy) var(--cpx);min-width:0;box-shadow:var(--card-shadow);
  transition:transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s;
}
.card>h2{margin-bottom:13px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ---------- HERO DINÁMICO "PULSE" CON GAUGE SEMICIRCULAR ---------- */
.pulse-wrap{display:flex;flex-direction:column;gap:12px}
.hero{
  position:relative;overflow:hidden;
  border-radius:calc(var(--r-card) + 6px);
  padding:20px 20px 18px;color:#F8FAFC;
  background:linear-gradient(135deg, #0F172A 0%, #1E293B 55%, #0F2942 100%);
  border:1px solid rgb(255 255 255 / .12);
  box-shadow:0 20px 44px -16px rgb(15 23 42 / .55), 0 4px 14px rgb(15 23 42 / .18);
}
.hero.st-ok{background:linear-gradient(135deg, #091E2C 0%, #0F2F45 55%, #0B3B3A 100%)}
.hero.st-warn{background:linear-gradient(135deg, #271A0C 0%, #3D2710 55%, #4A2511 100%)}
.hero.st-bad{background:linear-gradient(135deg, #2B0D16 0%, #451220 55%, #3B1325 100%)}
.hero::before{
  content:"";position:absolute;top:-70px;right:-40px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb, var(--accent) 45%, transparent) 0%, transparent 70%);
  pointer-events:none;
}
.hero::after{
  content:"";position:absolute;bottom:-90px;left:-50px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle, rgb(16 185 129 / .22) 0%, transparent 70%);
  pointer-events:none;
}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.hero .lbl{font-size:.73rem;color:#94A3B8;font-weight:750;text-transform:uppercase;letter-spacing:.1em;display:inline-flex;align-items:center;gap:6px}
.hero .lbl::before{content:"";width:8px;height:8px;border-radius:50%;background:#34D399;box-shadow:0 0 10px #34D399}
.hero.st-warn .lbl::before{background:#FBBF24;box-shadow:0 0 10px #FBBF24}
.hero.st-bad .lbl::before{background:#FB7185;box-shadow:0 0 10px #FB7185}
.hero .seg{background:rgb(255 255 255 / .11);border:1px solid rgb(255 255 255 / .14)}
.hero .seg button{color:#CBD5E1}
.hero .seg button.on{background:#FFFFFF;color:#0F172A;box-shadow:none}

.hero-main{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hero-left{flex:1;min-width:170px}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-block:0 6px}
.big .num{font-size:clamp(2.1rem,9.5vw,2.85rem);font-weight:800;line-height:1.02;letter-spacing:-.04em;color:#FFFFFF;overflow-wrap:anywhere}
.big .unit{font-family:var(--font-num);font-size:.76rem;font-weight:700;color:#E2E8F0;background:rgb(255 255 255 / .14);padding:3px 9px;border-radius:999px}
.big.neg .num{color:#FDA4AF}
.hero-sub{font-size:.82rem;color:#CBD5E1;line-height:1.4;margin-top:3px}
.hero-sub b{color:#FFFFFF;font-weight:700}

/* Gauge radial SVG */
.gauge{width:112px;height:74px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge svg{width:112px;height:72px;overflow:visible}
.g-bg{fill:none;stroke:rgb(255 255 255 / .14);stroke-width:9;stroke-linecap:round}
.g-fg{fill:none;stroke:#34D399;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .7s var(--ease)}
.hero.st-warn .g-fg{stroke:#FBBF24}
.hero.st-bad .g-fg{stroke:#FB7185}
.g-pct{fill:#FFFFFF;font-family:var(--font-num);font-size:15px;font-weight:800}
.g-lbl{fill:#94A3B8;font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}

/* Tira de píldoras dentro del hero */
.hero-foot{
  display:flex;flex-wrap:wrap;gap:7px;
  margin-top:14px;padding-top:12px;border-top:1px solid rgb(255 255 255 / .12);
}
.hero-chip{
  display:inline-flex;align-items:center;gap:6px;
  background:rgb(255 255 255 / .1);border:1px solid rgb(255 255 255 / .13);
  border-radius:999px;padding:5px 11px;font-size:.77rem;color:#E2E8F0;text-decoration:none;
  transition:background .15s, transform .14s var(--spring);
}
.hero-chip b{color:#FFFFFF;font-weight:700}
button.hero-chip:active{transform:scale(.94);background:rgb(255 255 255 / .22)}
.hero-sub.lk{
  display:inline-flex;align-items:center;gap:5px;
  background:rgb(255 255 255 / .1);border:1px solid rgb(255 255 255 / .13);
  border-radius:999px;padding:5px 11px;font:inherit;font-size:.77rem;color:#E2E8F0;text-decoration:none;
}

/* Cinta horizontal de acciones rápidas */
.qstrip{
  display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;
  margin-inline:-16px;padding-inline:16px;scrollbar-width:none;
}
.qstrip::-webkit-scrollbar{display:none}
.qpill{
  flex:none;display:inline-flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:8px 14px 8px 9px;font-size:.82rem;font-weight:700;color:var(--ink);
  box-shadow:var(--card-shadow);
  transition:transform .16s var(--spring), border-color .15s, background .15s;
}
.qpill:active{transform:scale(.93)}
.qpill i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal}
.qpill.c-gas i{background:var(--bad-bg);color:var(--bad)}
.qpill.c-ing i{background:var(--ok-bg);color:var(--ok)}
.qpill.c-cuo i{background:color-mix(in srgb, var(--c3) 16%, var(--surface));color:var(--c3)}
.qpill.c-aho i{background:var(--accent-tint);color:var(--accent)}
.qpill.c-aju i{background:var(--warn-bg);color:var(--warn)}

/* ---------- CARRUSEL HORIZONTAL DE BOLSILLOS (STATS DECK) ---------- */
.stats{
  display:flex;gap:11px;overflow-x:auto;scroll-snap-type:x mandatory;
  margin-inline:-16px;padding:2px 16px 8px;scrollbar-width:none;
  background:transparent;border:0;border-radius:0;
}
.stats::-webkit-scrollbar{display:none}
.stat{
  flex:0 0 158px;scroll-snap-align:start;
  position:relative;overflow:hidden;
  padding:15px 15px 14px;min-width:0;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  box-shadow:var(--card-shadow);display:flex;flex-direction:column;gap:6px;
  transition:transform .18s var(--spring), border-color .18s;
}
.stat:active{transform:scale(.96)}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--st-c, var(--accent))}
.stat.k-ing{--st-c:#10B981}
.stat.k-gas{--st-c:#F97316}
.stat.k-xp{--st-c:#F59E0B}
.stat.k-aho{--st-c:#8B5CF6}
.stat.k-dia{--st-c:#3B82F6}
.stat-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.stat-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb, var(--st-c, var(--accent)) 14%, var(--surface));color:var(--st-c, var(--accent))}
.stat .lbl{font-size:.73rem;color:var(--muted);font-weight:700;letter-spacing:.01em}
.stat .num{display:block;font-size:1.18rem;font-weight:800;letter-spacing:-.03em;overflow-wrap:anywhere}
.stat .sub{display:block;font-size:.71rem;color:var(--muted);line-height:1.3;margin-top:auto}

/* ---------- Timeline de Últimos Movimientos ---------- */
.tl-list{padding:0 16px 14px;position:relative}
.tl-item{
  position:relative;display:flex;align-items:center;gap:12px;
  padding:10px 0 10px 18px;width:100%;text-align:left;background:none;border:0;color:inherit;
}
.tl-item::before{
  content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--line);
}
.tl-item:first-child::before{top:50%}
.tl-item:last-child::before{bottom:50%}
.tl-item:only-child::before{display:none}
.tl-dot{
  position:absolute;left:1px;top:50%;transform:translateY(-50%);
  width:10px;height:10px;border-radius:50%;border:2px solid var(--surface);
  box-shadow:0 0 0 1.5px var(--line);
}
.tl-item .amt .num.pos{color:var(--ok)}

/* ---------- avisos ---------- */
.notice{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid transparent;border-radius:var(--r-md);padding:12px 15px;font-size:.85rem}
.notice.warn{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb, var(--warn) 25%, transparent)}
.notice.bad{background:var(--bad-bg);color:var(--bad);border-color:color-mix(in srgb, var(--bad) 25%, transparent)}
.notice b{font-weight:750}

/* ---------- controles segmentados ---------- */
.seg{display:inline-flex;background:var(--surface2);border-radius:var(--r-in);padding:3px;gap:3px;position:relative}
.seg label,.seg button{position:relative;margin:0}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span,.seg button{display:block;border:0;background:transparent;border-radius:var(--r-seg);padding:7px 14px;font-size:.82rem;font-weight:700;color:var(--muted);min-height:34px;transition:background .16s var(--ease), color .16s}
.seg input:checked+span,.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgb(0 0 0 / .1)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.seg.small span,.seg.small button{padding:4px 10px;font-size:.74rem;min-height:27px}
.seg.full{display:flex}.seg.full>*{flex:1}.seg.full button{text-align:center;padding-inline:6px}
.seg.full label span{text-align:center;padding-inline:6px}

/* ---------- píldoras, monedas e iconos ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.71rem;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.idle{background:var(--idle-bg);color:var(--idle)}
.cur{font-family:var(--font-num);font-size:.66rem;font-weight:750;border-radius:6px;padding:2px 6px;letter-spacing:.03em}
.cur.USDT{background:var(--usdt-bg);color:var(--usdt)}
.cur.BCV{background:var(--bcv-bg);color:var(--bcv)}
.cur.BS{background:var(--bs-bg);color:var(--bs)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.cat-ico{width:38px;height:38px;border-radius:13px;flex:none;display:grid;place-items:center}
.cat-ico svg{width:19px;height:19px}

/* ---------- categorías interactivas ---------- */
.cat-row{display:flex;align-items:center;gap:12px;padding:10px 8px;margin-inline:-8px;border-radius:14px;transition:background .15s}
.cat-row:hover{background:color-mix(in srgb, var(--surface2) 55%, transparent)}
.cat-row+.cat-row{border-top:1px solid color-mix(in srgb, var(--line) 65%, transparent)}
.cat-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.cat-top{display:flex;align-items:baseline;gap:8px;min-width:0}
.cat-top .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:680;font-size:.92rem}
.cat-top .num{font-size:.92rem;font-weight:700}
.cat-top .pc{font-size:.74rem;color:var(--muted);font-weight:650}
.track{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}
.fill{height:100%;border-radius:999px;transition:width .5s var(--ease)}
.bud{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.cat-tools{display:flex;align-items:center;gap:6px}
.mini-tog{
  width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);
  color:var(--ink);display:grid;place-items:center;padding:0;transition:background .15s, color .15s;
}
.mini-tog.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* ---------- regla de pagos 1-31 ---------- */
.ruler{display:grid;grid-template-columns:repeat(31,minmax(0,1fr));gap:2.5px;margin-block:4px 0}
.ruler .t{height:24px;border-radius:5px;background:var(--surface2);position:relative}
.ruler .t.w{background:color-mix(in srgb, var(--accent) 26%, var(--surface2))}
.ruler .t.got{background:var(--accent)}
.ruler .t.today::after{content:"";position:absolute;left:50%;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--ink);border-radius:2px}

var Store={
  mode:'local',db:null,id:null,
  init:function(){
    var self=this;

        var cl=window.claude; if(!cl||!cl.use) return;
        var timeout=new Promise(function(r){setTimeout(function(){r(null)},6000)});
        var got=await Promise.race([Promise.all([cl.use('db'),cl.use('user')]),timeout]);
        if(!got||!got[0]||!got[1]) return;

    if(k==='needpass') return 'Los datos de ese gist están cifrados: escribe la contraseña de cifrado.';
    if(k==='noenc') return 'Ese gist no está cifrado. Deja la contraseña vacía o crea un gist nuevo.';

function addMonthsDate(s,n){var p=s.split('-').map(Number),t=new Date(p[0],p[1]-1+n,1),dm=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(Math.min(p[2],dm))}
function cuotas(c){
  var rest=Math.max(0,c.total-c.inicial),base=r2(rest/c.n),out=[],tipo=c.tipo||'cashea',pl=c.plan&&c.plan.length===c.n?c.plan:null;
  var gord=[],gcnt={},gpos={};
  if(pl) pl.forEach(function(p,ix){var g=p.g!=null?p.g:ix; if(!(g in gcnt)){gcnt[g]=0;gord.push(g)} gpos[ix]=++gcnt[g]});
  for(var i=1;i<=c.n;i++){
    var m=pl?pl[i-1].m:(i<c.n?base:r2(rest-base*(c.n-1)));
    var due=pl?pl[i-1].d:addDays(c.primera,(i-1)*c.dias),paid=c.pagos&&validDate(c.pagos[i])?c.pagos[i]:'',pt=paid&&c.ptasas?c.ptasas[i]:null;
    var q={i:i,monto:m,due:due,paid:paid,tipo:tipo,aprox:tipo!=='cashea'&&!!c.aprox&&!paid,key:(paid||due).slice(0,7),f:pt&&pt.f>0?pt.f:undefined,tu:pt?pt.tu:undefined,tb:pt?pt.tb:undefined};
    if(pl){var p=pl[i-1],g=p.g!=null?p.g:i-1; q.g=g;q.gn=gord.indexOf(g)+1;q.pj=gpos[i-1];q.pn=gcnt[g];q.v=p.v||'';q.cubierta=!paid&&!(m>0)}
    out.push(q);
  }
  return out;
}
/* Recalcula lo que falta por pagar: cada cuota (o parte) tiene un monto base; lo pagado de más o de menos se
   compensa en los pagos pendientes siguientes. Si al final queda deuda sin partes, se agrega una parte extra. */
function redistribuir(c){
  var pl=c.plan; if(!pl||!pl.length) return;
  var rest=r2(c.total-c.inicial),gs=[],gi={};
  pl.forEach(function(p,i){var g=p.g!=null?p.g:i; if(!(g in gi)){gi[g]=gs.length;gs.push({g:g,idx:[]})} gs[gi[g]].idx.push(i)});
  var cum=0,paidCum=0,alloc=0;
  gs.forEach(function(gr,k){
    cum+=sum(gr.idx.map(function(i){var b=pl[i].b; return b>=0?b:pl[i].m}));
    var pa=gr.idx.filter(function(i){return c.pagos[i+1]}),un=gr.idx.filter(function(i){return !c.pagos[i+1]});
    paidCum+=sum(pa.map(function(i){return pl[i].m}));
    if(!un.length) return;
    var need=r2((k===gs.length-1?rest:cum)-paidCum-alloc);
    if(need<=0.004){un.forEach(function(i){pl[i].m=0});return}
    var each=r2(need/un.length),acc=0;
    un.forEach(function(i,j){var v=j<un.length-1?each:r2(need-acc);pl[i].m=v;acc=r2(acc+v)});
    alloc=r2(alloc+need);
  });
  /* Si se pagó de más una parte posterior mientras las anteriores seguían pendientes, esas pendientes quedaron sumando de más:
     el exceso se descuenta de las pendientes empezando por la última, sin dejar ninguna en negativo. */
  var ex=r2(sum(pl.map(function(p){return p.m}))-rest);
  for(var ix=pl.length-1;ix>=0&&ex>0.004;ix--){
    if(c.pagos[ix+1]) continue;
    var tk=Math.min(pl[ix].m,ex); pl[ix].m=r2(pl[ix].m-tk); ex=r2(ex-tk);
  }
  var last=gs[gs.length-1],sobra=r2(rest-sum(pl.map(function(p){return p.m})));
  if(!last.idx.some(function(i){return !c.pagos[i+1]})&&sobra>0.004){
    var lp=pl[pl.length-1],mg=Math.max.apply(null,pl.map(function(p){return Number(p.g)||0}))+1,np={m:sobra,b:sobra,d:addMonthsDate(lp.d,1),g:mg};
    if(lp.v) np.v=addMonthsDate(lp.v,1);
    pl.push(np); c.n=pl.length;
  }
}
function genMensual(total,ini,meses,firstDue,pdias){
  var rest=r2(total-ini),base=r2(rest/meses),dd=Number(firstDue.slice(8,10)),out=[];
  for(var g=0;g<meses;g++){
    var mg=g<meses-1?base:r2(rest-base*(meses-1)),v=addMonthsDate(firstDue,g),vy=Number(v.slice(0,4)),vm=Number(v.slice(5,7));
    var dates=pdias.map(function(d){
      var y=vy,m=vm; if(d>dd){m--; if(m<1){m=12;y--}}
      return y+'-'+pad(m)+'-'+pad(Math.min(d,new Date(y,m,0).getDate()));
    }).sort();
    var each=r2(mg/dates.length),acc=0;
    dates.forEach(function(d,j){var a=j<dates.length-1?each:r2(mg-acc);acc=r2(acc+a);out.push({m:a,b:a,d:d,g:g,v:v})});
  }
  return out;
}
function parseDias(str){var a=String(str||'').split(/[^0-9]+/).filter(Boolean).map(Number),out=[];a.forEach(function(x){if(out.indexOf(x)<0) out.push(x)});return out}
function infoCashea(c){
  var qs=cuotas(c),pg=qs.filter(function(q){return q.paid}),sig=qs.filter(function(q){return !q.paid&&!q.cubierta})[0]||null;
  var pagado=r2(c.inicial+sum(pg.map(function(q){return q.monto})));
  return {qs:qs,pagadas:pg.length,sig:sig,pagado:pagado,resta:Math.max(0,r2(c.total-pagado)),done:!sig&&Math.max(0,r2(c.total-pagado))<0.005};
}
function cuotasDelMes(key,loan,deuda){
  var ini=[],cu=[],out=[];
  CFG.cashea.forEach(function(c){
    if(!!esCobro(c)!==!!loan||!!esDeuda(c)!==!!deuda) return;
    if(c.inicial>0&&c.fecha.slice(0,7)===key) ini.push({c:c,u:cv(c.inicial,c.moneda,key,c.f)+iniCom(c),com:iniCom(c)});
    if(loan&&c.fecha.slice(0,7)===key) out.push({c:c,u:cv(c.total,c.moneda,key,c.f)});
    /* deuda: lo que te prestaron entra a tu saldo el día que lo recibes (si no, ya estaba contado en otro lado) */
    if(deuda&&c.recibido!==false&&c.fecha.slice(0,7)===key) out.push({c:c,u:cv(c.total,c.moneda,key,c.f)});
    cuotas(c).forEach(function(q){if(q.key===key&&!q.cubierta){var qc=qCom(c,q);cu.push({c:c,q:q,u:cv(q.monto,c.moneda,key,q.f)+qc,com:qc})}});
  });
  cu.sort(function(a,b){return a.q.due<b.q.due?-1:a.q.due>b.q.due?1:0});
  return {ini:ini,cu:cu,out:out};
}
function casheaDelMes(key){return cuotasDelMes(key,false,false)}
function prestamosDelMes(key){return cuotasDelMes(key,true,false)}
function deudasDelMes(key){return cuotasDelMes(key,false,true)}
function estadoCuota(q){
  if(q.cubierta) return {t:'ok',txt:'Cubierta por pagos anteriores'};
  var cobro=q.tipo==='prestamo',ap=q.aprox;
  if(q.paid) return {t:'ok',txt:(cobro?'Cobrada el ':'Pagada el ')+dateShort(q.paid)};
  var d=dayDiff(q.due,ymd(NOW));
  if(d<0) return {t:'bad',txt:(cobro?'Atrasada hace ':'Vencida hace ')+(-d)+' d'};
  if(d===0) return {t:'warn',txt:ap?'Aprox. hoy':cobro?'Se espera hoy':'Vence hoy'};
  if(d<=3) return {t:'warn',txt:(ap?'Aprox. en ':cobro?'Se espera en ':'Vence en ')+d+' d'};
  return {t:'idle',txt:ap?'Aprox. el '+dateShort(q.due):(cobro?'Se espera el ':'Vence el ')+dateShort(q.due)};
}
function cuotasVencidas(loan,deuda){
  var hoy=ymd(NOW),n=0;
  CFG.cashea.forEach(function(c){if(!!esCobro(c)!==!!loan||!!esDeuda(c)!==!!deuda) return; cuotas(c).forEach(function(q){if(!q.paid&&!q.cubierta&&q.due<hoy) n++})});
  return n;
}
function payDate(due){return curKey<nowKey?due:ymd(NOW)}
/* "hoy" se vuelve a leer cuando la app vuelve a primer plano o pasa la medianoche; si hay una hoja abierta espera a que se cierre */
function repintar(){var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){setTimeout(repintar,4000);return}render()}
function refreshNow(){
  if(!ready||!overlay.hidden) return;
  var n=new Date(),d=ymd(n); if(d===lastDay) return;
  var seguia=curKey===nowKey;
  NOW=n; lastDay=d; nowKey=monthKey(n);
  if(seguia&&curKey!==nowKey){curKey=nowKey;Promise.all([getMes(curKey),getMes(addMonths(curKey,-1))]).then(repintar)}
  else repintar();
}

/* ---------- cálculos ---------- */
function fijosDelMes(key,mes){
  return CFG.fijos.filter(function(f){return f.desde<=key&&(!f.hasta||f.hasta>=key)}).map(function(f){
    var e=mes.fijos[f.id]||{};
    var mon=e.moneda||f.moneda,pg=!!e.pagado;
    var tiene=e.monto!=null&&Number(e.monto)>0;
    var monto=tiene?Number(e.monto):0;
    var cm=pg&&Number(e.com)>0?Number(e.com):0;
    return {f:f,pagado:pg,fechaPago:e.fecha||'',monto:monto,sinMonto:!tiene,moneda:mon,com:cm,tf:pg?e.f:undefined,tu:pg?e.tu:undefined,tb:pg?e.tb:undefined,est:!pg&&tiene&&mon==='BCV',dia:Math.min(f.dia,daysIn(key))};
  }).sort(function(a,b){return a.dia-b.dia});
}
function fijoPrevMap(key){
  var pk=addMonths(key,-1),pm=MES[pk],map={};
  if(pm) fijosDelMes(pk,pm).forEach(function(x){if(x.pagado&&x.monto>0) map[x.f.id]={x:x,u:fu(x,pk)}});
  return {pk:pk,map:map};
}
function fu(x,key){return cv(x.monto,x.moneda,key,x.tf,x.tu)+(x.com||0)}
function liberarFijo(e){e.pagado=false;delete e.fecha;delete e.f;delete e.tu;delete e.tb;delete e.com;delete e.monto;delete e.moneda;delete e.auto}
/* los fijos pagados con el check rápido no guardaban el monto: se congela el vigente para que editar el fijo no cambie el historial */
function congelarPagados(mes,key){
  var ch=false;
  Object.keys(mes.fijos).forEach(function(id){
    var e=mes.fijos[id]; if(!e||typeof e!=='object'||!e.pagado||e.monto!=null) return;
    var f=CFG.fijos.filter(function(x){return x.id===id})[0]; if(!f||f.desde>key||(f.hasta&&f.hasta<key)) return;
    e.monto=f.monto; e.moneda=f.moneda; e.auto=true; ch=true;
  });
  return ch;
}
function adoptar(key,d){var m=normalizeMes(d); if(congelarPagados(m,key)) setTimeout(function(){saveMes(key)},0); return m}
function totalesBase(key,mes){
  var fj=fijosDelMes(key,mes),cs=casheaDelMes(key),pr=prestamosDelMes(key),dd=deudasDelMes(key);
  var ing0=sum(Object.keys(mes.ingresos).map(function(k){return mes.ingresos[k]?iu(mes.ingresos[k],key):0}));
  var ext=sum(mes.extras.map(function(x){return iu(x,key)}));
  var ah=sum(mes.ahorros.map(function(x){return iu(x,key)}));
  var aj=sum((mes.ajustes||[]).map(function(x){return Number(x.monto)||0}));   /* ajustes de saldo: corrigen lo que queda, no son ingreso ni gasto */
  var ing=ing0+ext;
  var pag=sum(fj.filter(function(x){return x.pagado}).map(function(x){return fu(x,key)}));
  var pen=sum(fj.filter(function(x){return !x.pagado}).map(function(x){return fu(x,key)}));
  var vr=sum(mes.variables.map(function(v){return vu(v,key)}));
  var csPag=sum(cs.ini.map(function(x){return x.u}))+sum(cs.cu.filter(function(x){return x.q.paid}).map(function(x){return x.u}));
  var csPen=sum(cs.cu.filter(function(x){return !x.q.paid}).map(function(x){return x.u}));
  var gastado=pag+vr+csPag;
  var comPag=sum(fj.filter(function(x){return x.pagado}).map(function(x){return x.com}))+sum(mes.variables.map(comU))+sum(cs.ini.map(function(x){return x.com}))+sum(cs.cu.filter(function(x){return x.q.paid}).map(function(x){return x.com}))+sum(dd.ini.map(function(x){return x.com}))+sum(dd.cu.filter(function(x){return x.q.paid}).map(function(x){return x.com}));
  var deudaIn=sum(dd.out.map(function(x){return x.u})),deudaPag=sum(dd.ini.map(function(x){return x.u}))+sum(dd.cu.filter(function(x){return x.q.paid}).map(function(x){return x.u}));
  var deudaPen=sum(dd.cu.filter(function(x){return !x.q.paid}).map(function(x){return x.u}));
  var prestado=sum(pr.out.map(function(x){return x.u})),cobrado=sum(pr.ini.map(function(x){return x.u}))+sum(pr.cu.filter(function(x){return x.q.paid}).map(function(x){return x.u}));
  var porCobrar=sum(pr.cu.filter(function(x){return !x.q.paid}).map(function(x){return x.u}));
  return {key:key,estim:fj.some(function(x){return x.est})||cs.cu.some(function(x){return !x.q.paid&&x.c.moneda==='BCV'}),fj:fj,cs:cs,pr:pr,dd:dd,deudaIn:deudaIn,deudaPag:deudaPag,deudaPen:deudaPen,prestado:prestado,cobrado:cobrado,porCobrar:porCobrar,ing:ing,ing0:ing0,ext:ext,ah:ah,aj:aj,pag:pag,pen:pen,vr:vr,com:comPag,csPag:csPag,csPen:csPen,porPagar:pen+csPen+deudaPen,gastado:gastado,flujo:ing-gastado-ah-prestado+cobrado+aj+deudaIn-deudaPag,arr:0,queda:ing-gastado-ah-prestado+cobrado+aj+deudaIn-deudaPag,libre:ing-gastado-ah-prestado+cobrado+aj+deudaIn-deudaPag-pen-csPen-deudaPen};
}

/* ---------- saldo que pasa de un mes al siguiente ----------
   Lo que queda al cerrar un mes (ingresos - gastos - ahorro - préstamos + cobros) se suma a "Te queda" del mes siguiente.
   No cuenta como ingreso ni como gasto: solo se traslada. Se arrastra sumando lo que quedó en cada mes desde el inicio. */
function arrOn(){return !CFG.arr||CFG.arr.on!==false}
function mesTieneDatos(m){
  if(!m) return false;
  return m.variables.length>0||m.extras.length>0||m.ahorros.length>0||(m.ajustes||[]).length>0||
    Object.keys(m.ingresos).some(function(k){return !!m.ingresos[k]})||
    Object.keys(m.fijos).some(function(id){var e=m.fijos[id];return !!e&&typeof e==='object'&&!!e.pagado});
}
/* primer mes con ingresos o gastos registrados: desde ahí empieza la cuenta si no se eligió otro mes */
function arrAuto(){
  var min='';
  Object.keys(MES).forEach(function(k){if(RE_YM.test(k)&&mesTieneDatos(MES[k])&&(!min||k<min)) min=k});
  return min;
}
function arrInicio(){var d=CFG.arr&&RE_YM.test(String(CFG.arr.desde))?String(CFG.arr.desde):'';return d||arrAuto()}
/* mapa[k] = lo que llega a k desde los meses anteriores; un mes sin entrada no arrastra nada */
function arrMapa(hasta){
  var out={},ini=arrInicio();
  if(!arrOn()||!ini||ini>=hasta) return out;
  var k=ini,acc=0,n=0;
  while(k<hasta&&n++<600){
    acc+=totalesBase(k,MES[k]||defaultMes()).flujo;
    k=addMonths(k,1);
    out[k]=acc;
  }
  return out;
}
function arrastreDe(key){return arrMapa(key)[key]||0}
/* Totales del mes con el saldo que viene de los meses anteriores. "mapa" evita recalcular cuando se piden varios meses seguidos. */
function totalesDe(key,mes,mapa){
  var t=totalesBase(key,mes),a=mapa?(mapa[key]||0):arrastreDe(key);
  t.arr=a; t.queda=t.flujo+a; t.penAnt=pendAnteriores(key).total; t.libre=t.libre+a-t.penAnt;
  return t;
}
/* ---------- pendientes de meses anteriores ----------
   Lo que quedó sin pagar antes del mes que ves (fijos sin marcar y cuotas vencidas) sigue siendo plata que debes:
   se resta en "Después de pagar lo pendiente". No cambia "Te queda" ni el saldo que pasa de un mes a otro. */
function penAntOn(){return !CFG.penAnt||CFG.penAnt.on!==false}
function pendAnteriores(key){
  var out={fj:[],cu:[],total:0};
  if(!penAntOn()) return out;
  var ini=arrInicio(),k,n=0;
  if(ini&&ini<key){
    for(k=ini;k<key&&n++<600;k=addMonths(k,1)){
      var m=MES[k]; if(!m||!mesTieneDatos(m)) continue;
      fijosDelMes(k,m).forEach(function(x){if(!x.pagado&&x.monto>0) out.fj.push({k:k,x:x,u:fu(x,k)})});
    }
  }
  CFG.cashea.forEach(function(c){
    if(esCobro(c)) return;
    cuotas(c).forEach(function(q){if(!q.paid&&!q.cubierta&&q.key<key) out.cu.push({k:q.key,c:c,q:q,u:cv(q.monto,c.moneda,q.key,q.f)})});
  });
  out.total=sum(out.fj.map(function(x){return x.u}))+sum(out.cu.map(function(x){return x.u}));
  return out;
}
/* lo que puedes gastar por día hasta fin de mes: "Después de pagar lo pendiente" entre los días que faltan (hoy incluido). Solo en el mes actual. */
function porDia(t){
  if(curKey!==nowKey||!t) return null;
  var dias=daysIn(curKey)-NOW.getDate()+1; if(!(dias>=1)) return null;
  return {per:t.libre/dias,dias:dias};
}
function porDiaTxt(t){
  var pd=porDia(t); if(!pd||!(t.libre>0.005)) return '';
  return ' · unos <b class="num">'+money(pd.per)+'</b> por día ('+pd.dias+(pd.dias===1?' día':' días')+')';
}
function sgn(n){return (n>0?'+':n<0?'−':'')+fmt(Math.abs(n))}
function ajLinea(t){
  if(Math.abs(t.aj)>=0.005) return '<button class="hero-sub lk" data-a="ajustes">Incluye un ajuste de saldo de <b class="num">'+esc(sgn(t.aj))+'</b> '+esc(A())+' · Ver</button>';
  return '<button class="hero-sub lk" data-a="new-ajuste" style="opacity:.8">¿No coincide con lo que tienes? Ajustar saldo</button>';
}
function penAntLinea(t){
  if(!penAntOn()||!(t.penAnt>=0.005)) return '';
  return '<button class="hero-sub lk" data-a="pend-ant">Incluye <b class="num">'+money(t.penAnt)+'</b> '+esc(cn(DC()))+' sin pagar de meses anteriores · Ver</button>';
}
function sheetPendAnt(){
  var p=pendAnteriores(curKey);
  var fila=function(k,g,id,t1,u,txt){return '<button class="row" data-a="ir-pend" data-k="'+esc(k)+'" data-g="'+g+'"><span class="main"><span class="t1">'+esc(t1)+'</span><span class="t2"><span class="mes-tag">'+esc(monthShort(k))+' '+esc(k.slice(2,4))+'</span><span class="pill bad">'+esc(txt)+'</span></span></span><div class="amt"><span class="num">'+money(u)+'</span><span class="eq">'+esc(cn(DC()))+'</span></div></button>'};
  var rows=p.fj.map(function(x){return fila(x.k,'fijos',x.x.f.id,x.x.f.nombre,x.u,'Sin pagar')}).concat(
    p.cu.map(function(x){return fila(x.k,'cashea',x.c.id,x.c.desc+' · '+parteTxt(x.c,x.q),x.u,'Vencida el '+dateShort(x.q.due))}));
  openSheet('<div class="col"><h2>Sin pagar de meses anteriores</h2><p class="hint">Quedaron pendientes antes de '+esc(monthLabel(curKey))+' y se restan en “Después de pagar lo pendiente”. Si ya los pagaste, toca el que sea para ir a ese mes y márcalo como pagado.</p>'+
    (rows.length?'<section class="card list">'+rows.join('')+'</section><div class="total-line"><span class="muted">Total</span><span><span class="num">'+money(p.total)+'</span> '+esc(cn(DC()))+'</span></div>':'<p class="hint">No hay nada pendiente de meses anteriores.</p>')+
    '<button class="btn ghost" data-a="close">Cerrar</button></div>');
}
function penAntCard(){
  return '<section class="card"><h2>Pendientes de meses anteriores</h2><div class="stack" style="gap:12px">'+
    chkRow('pa-toggle','Restar lo que quedó sin pagar de meses anteriores',penAntOn())+
    '<p class="hint">Los fijos que no marcaste como pagados y las cuotas vencidas de meses pasados se restan en “Después de pagar lo pendiente”, para que no desaparezcan de tus cuentas. No cambian “'+esc(L('queda'))+'” ni el saldo que pasa al mes siguiente.</p></div></section>';
}
function totales(mes){return totalesDe(curKey,mes)}
function arrLinea(t){
  if(!arrOn()||!(Math.abs(t.arr)>=0.005)) return '';
  var m=esc(monthName(addMonths(t.key,-1)).toLowerCase());
  return '<p class="hero-sub">Incluye <b class="num">'+money(t.arr)+'</b> '+esc(cn(DC()))+(t.arr>0?' que te sobraron de ':' que quedaron en rojo en ')+m+'</p>';
}
function arrHint(t){
  if(!arrOn()||!(Math.abs(t.arr)>=0.005)) return '';
  var m=esc(monthName(addMonths(t.key,-1)).toLowerCase());
  return '<p class="hint" style="margin-top:8px">'+(t.arr>0
    ?'Además, de '+m+' te sobraron <span class="num">'+fmt(t.arr)+'</span> '+esc(A())+' y ya están sumados en “'+esc(L('queda'))+'”. No cuentan como ingreso.'
    :'Además, '+m+' cerró en rojo por <span class="num">'+fmt(-t.arr)+'</span> '+esc(A())+' y se resta de “'+esc(L('queda'))+'”.')+'</p>';
}
function catMapa(t,mes,m){
  var out={},key=t.key,todo=m==='todo';
  function add(id,u){id=id||'';out[id]=(out[id]||0)+u}
  t.fj.forEach(function(x){if((x.pagado||todo)&&x.monto>0) add(x.f.catId,fu(x,key))});
  mes.variables.forEach(function(v){add(v.catId,vu(v,key))});
  t.cs.ini.forEach(function(x){add(x.c.catId,x.u)});
  t.cs.cu.forEach(function(x){if(x.q.paid||todo) add(x.c.catId,x.u)});
  return out;
}
function porCategoria(mes,t,m){
  var map=catMapa(t,mes,m);
  CFG.categorias.forEach(function(c){if(c.presupuesto>0&&!(c.id in map)) map[c.id]=0});
  return Object.keys(map).map(function(id){return {cat:catById(id),val:map[id]}}).sort(function(a,b){return b.val-a.val});
}
function slotTitulo(s){return s.mesAnt?s.nombre+' de '+monthName(addMonths(curKey,-1)).toLowerCase():s.nombre}
function estadoIngreso(s,mes){
  if(mes.ingresos[s.id]) return {t:'ok',txt:'Recibido'};
  var d=NOW.getDate(),nd=daysIn(curKey),d1=Math.min(s.d1,nd),d2=Math.min(s.d2,nd);
  if(curKey<nowKey) return {t:'bad',txt:'Sin registrar'};
  if(curKey>nowKey) return {t:'idle',txt:'Pendiente'};
  if(d<d1) return {t:'idle',txt:'Faltan '+(d1-d)+(d1-d===1?' día':' días')};
  if(d<=d2) return {t:'warn',txt:'Toca cobrar'};
  return {t:'bad',txt:'Atrasado'};
}
function fijoEstado(x){
  if(x.pagado) return {t:'ok',txt:x.fechaPago?'Pagado el '+dateShort(x.fechaPago):'Pagado'};
  if(curKey<nowKey) return {t:'bad',txt:'Sin pagar'};
  if(curKey>nowKey) return {t:'idle',txt:'Pendiente'};
  var diff=x.dia-NOW.getDate();
  if(diff<0) return {t:'bad',txt:'Vencido hace '+(-diff)+' d'};
  if(diff===0) return {t:'warn',txt:'Vence hoy'};
  if(diff<=3) return {t:'warn',txt:'Vence en '+diff+' d'};
  return {t:'idle',txt:'Vence el '+x.dia};
}

function fijoVarBadge(curU,prevU){

}

       '<ol class="steps"><li><a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=Cuentas%20del%20Mes" target="_blank" rel="noopener">Crea un token en GitHub</a> (clásico, con solo el permiso “gist”) y pégalo abajo.</li>'+
       '<li>Elige una contraseña de cifrado. Si la pierdes, no se pueden recuperar los datos de la nube.</li>'+
       '<li>En el primer dispositivo deja el ID vacío: se crea el gist. En los demás pega el ID, el mismo token y la misma contraseña.</li></ol>'+

       '<label class="fld"><span>Contraseña de cifrado</span><input type="password" id="g-pass" autocomplete="off"></label>'+
       (Sync.cryptoOk?'<label class="check"><input type="checkbox" id="g-rem" checked><span>Recordar la contraseña en este dispositivo</span></label><p class="hint" style="margin-top:-4px">Si no la recuerdas, la app te la pide cada vez que se abre. El token siempre queda guardado aquí.</p>':'<p class="hint">Este navegador no permite cifrar. Puedes conectar sin contraseña, pero los datos irían sin cifrar.</p>')+
       '<p class="err" id="g-err" role="alert" hidden></p>'+
       '<button class="btn block" data-a="gist-connect">Conectar</button></div>';

       '<div class="stack" style="gap:10px"><label class="fld"><span>Contraseña de cifrado</span><input type="password" id="g-upass" autocomplete="off"></label><p class="err" id="g-uerr" role="alert" hidden></p>'+
       '<button class="btn block" data-a="gist-unlock">Desbloquear</button><button class="btn danger block" data-a="gist-off">Desconectar este dispositivo</button></div>';
  }else{
    var st=Sync.st,txt=(st==='ok'||st==='idle')?'Sincronizado'+(Sync.last?' a las '+new Date(Sync.last).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}):''):st==='sync'?'Sincronizando…':st==='pending'?'Cambios pendientes de enviar':st==='offline'?'Sin conexión: se enviará cuando vuelva':'Error: '+esc(Sync.err||'no se pudo sincronizar');
    h+='<p class="hint" style="margin-bottom:8px"><span class="pill '+((st==='ok'||st==='idle')?'ok':st==='error'?'bad':'warn')+'">'+txt+'</span></p>'+
       '<p class="hint" style="margin-bottom:4px">ID del gist (para tus otros dispositivos):</p>'+
       '<p class="num" style="font-size:.85rem;overflow-wrap:anywhere;margin-bottom:12px">'+esc(Sync.cfg.id)+'</p>'+

       '<button class="btn danger block" style="margin-top:10px" data-a="gist-off">Desconectar este dispositivo</button>';

function gastosItems(keys,todo){
  var out=[];

    mes.variables.forEach(function(v){out.push({k:k,date:v.fecha||'',cat:v.catId||'',tipo:'variable',u:vu(v,k)})});

function short(n){
  var a=Math.abs(n),r=function(x){return String(x).replace('.',DS())};
  if(a>=1e6) return r((n/1e6).toFixed(1))+'M';
  if(a>=1e4) return Math.round(n/1e3)+'k';
  if(a>=1e3) return r((n/1e3).toFixed(1))+'k';
  if(a>=100) return String(Math.round(n));
  if(a>=10) return r(Math.round(n*10)/10);

function chartModel(){
  var c=chartCfg,y=curKey.slice(0,4),keys=[];
  if(c.periodo==='mes') keys=[curKey]; else for(var m=1;m<=12;m++) keys.push(y+'-'+pad(m));
  var items=gastosItems(keys,c.pend).filter(function(it){return c.hideCat.indexOf(it.cat)<0&&c.hideTipo.indexOf(it.tipo)<0});
  items.forEach(function(it){it.v=fromUSDT(it.u,DC(),curKey)});
  var model={total:sum(items.map(function(it){return it.v})),count:items.length,time:false};
  if(c.grupo==='cat'||c.grupo==='tipo'){
    var map={};
    items.forEach(function(it){var id=c.grupo==='cat'?it.cat:it.tipo;map[id]=(map[id]||0)+it.v});
    model.cats=Object.keys(map).map(function(id){var mt=c.grupo==='cat'?catById(id):tiposGasto().filter(function(t){return t.id===id})[0];return {id:id,name:mt.nombre,color:mt.color,v:map[id]}}).filter(function(x){return x.v>0.004}).sort(function(a,b){return b.v-a.v});
  }else{
    var n=c.grupo==='dia'?daysIn(curKey):12,tot=[],by={},und=0,i;
    for(i=0;i<n;i++) tot.push(0);
    items.forEach(function(it){
      var j;
      if(c.grupo==='dia'){if(!it.date){und++;return} j=parseInt(it.date.slice(8,10),10)-1; if(!(j>=0&&j<n)){und++;return}}
      else j=parseInt(it.k.slice(5,7),10)-1;
      tot[j]+=it.v;
      if(!by[it.cat]){by[it.cat]=[];for(var q=0;q<n;q++) by[it.cat].push(0)}
      by[it.cat][j]+=it.v;
    });
    model.time=true; model.n=n; model.tot=tot; model.und=und;
    model.labels=tot.map(function(_,k){return c.grupo==='dia'?String(k+1):monthShort(y+'-'+pad(k+1))});

  }
  return model;
}

function readMoney(v){
  var o={monto:parseNum(v.monto),moneda:v.moneda==='BCV'?'BCV':v.moneda==='BS'?'BS':'USDT'};
  if(o.moneda==='BS'){
    /* pago en bolívares: se guardan los Bs y las dos tasas del día; de ahí salen USDT (Bs ÷ tasa USDT) y BCV (Bs ÷ tasa BCV) */
    var bu=parseRate(v.tu),bb=parseRate(v.tb);
    if(bu>0&&bb>0&&bb/bu>0.05&&bb/bu<=1.5){o.tu=bu;o.tb=bb;o.f=Math.round(bb/bu*1e6)/1e6}
  }else if(o.moneda==='BCV'){
    var tu=parseRate(v.tu),tb=parseRate(v.tb),tp=parseRate(v.tp);
    if(tu>0&&tb>0&&tb/tu>0.05&&tb/tu<=1.5){o.tu=tu;o.tb=tb;o.f=Math.round(tb/tu*1e6)/1e6}
    else if(String(v.tp==null?'':v.tp).trim()!==''&&isFinite(tp)&&tp>=0&&tp<=90) o.f=Math.round((1-tp/100)*10000)/10000;
  }
  return o;
}
function rateErr(v){
  if(v.moneda==='BS'){
    var su=parseRate(v.tu),sb=parseRate(v.tb);
    if(!(su>0&&sb>0)) return 'Para un pago en Bs escribe tasas válidas de '+A()+' y '+B()+'. '+sepHint();
    if(!(sb/su>0.05&&sb/su<=1.5)) return 'Esas tasas dan un porcentaje fuera de lo normal. Revisa los números.';
    return '';
  }
  if(v.moneda!=='BCV') return '';
  var a=String(v.tu==null?'':v.tu).trim()!=='',b=String(v.tb==null?'':v.tb).trim()!=='';
  if(a!==b) return 'Escribe las dos tasas, '+A()+' y '+B()+', o deja ambas vacías.';
  if(a&&b){
    var tu=parseRate(v.tu),tb=parseRate(v.tb);
    if(!(tu>0&&tb>0)) return 'Las tasas deben ser números mayores que cero. '+sepHint();
    if(!(tb/tu>0.05&&tb/tu<=1.5)) return 'Esas tasas dan un porcentaje fuera de lo normal. Revisa los números.';
  }else if(String(v.tp==null?'':v.tp).trim()!==''){
    var p=parseRate(v.tp); if(!(p>=0&&p<=90)) return 'El porcentaje debe estar entre 0 y 90.';
  }
  return '';
}

function sheetAjuste(id){
  var mes=mesActual(),ex=id?(mes.ajustes||[]).filter(function(x){return x.id===id})[0]:null;
  var base=totales(mes).queda-(ex?Number(ex.monto)||0:0);
  var d=ex||{id:uid(),monto:'',nota:'',fecha:curKey===nowKey?ymd(NOW):curKey+'-01'};
  var dif0=ex?Number(ex.monto):NaN;
  function n2(v){return numIn(Math.round(v*100)/100)}
  function pn(x){return parseNum(String(x==null?'':x).replace(/^\s*[+]/,'').replace(/[−–]/g,'-'))}
  openSheet('<form id="f" novalidate><h2>'+(ex?'Editar ajuste':'Ajustar saldo')+'</h2>'+
   '<p class="hint">Úsalo cuando lo que dice la app no coincide con lo que realmente tienes (en Binance, en el banco, en efectivo). Se guarda solo la diferencia: no cuenta como ingreso ni como gasto.</p>'+
   '<div class="total-line"><span class="muted">La app dice que te queda</span><span><span class="num">'+fmt(base)+'</span> '+esc(A())+'</span></div>'+
   '<label class="fld"><span>Lo que realmente tienes ('+esc(A())+')</span><input type="text" inputmode="decimal" name="real" value="'+(ex?esc(n2(base+dif0)):'')+'" placeholder="0,00" autocomplete="off"></label>'+
   '<label class="fld"><span>Diferencia <em>(se calcula sola; negativa si te falta)</em></span><input type="text" inputmode="decimal" name="dif" value="'+(ex?esc(n2(dif0)):'')+'" placeholder="0,00" autocomplete="off"></label>'+
   '<label class="fld"><span>Nota <em>(opcional)</em></span><input type="text" name="nota" value="'+esc(d.nota||'')+'" placeholder="Ej: Efectivo que no anoté" autocomplete="off" maxlength="80"></label>'+
   '<label class="fld"><span>Fecha</span><input type="date" name="fecha" value="'+esc(d.fecha||'')+'"></label>'+
   '<p class="err" id="err" role="alert" hidden></p>'+
   '<div class="actions"><button class="btn" type="submit">Guardar</button><button class="btn ghost" type="button" data-a="close">Cancelar</button></div>'+
   (ex?'<button class="btn danger" type="button" data-a="del-ajuste" data-id="'+esc(d.id)+'">Eliminar ajuste</button>':'')+'</form>',
  function(sh){
    var form=sh.querySelector('#f'),rf=form.elements.real,df=form.elements.dif;
    rf.addEventListener('input',function(){var v=pn(rf.value); df.value=isFinite(v)?n2(v-base):''});
    df.addEventListener('input',function(){var v=pn(df.value); rf.value=isFinite(v)?n2(base+v):''});
    form.addEventListener('submit',function(e){
      e.preventDefault();
      var v=Object.fromEntries(new FormData(form)),dif=pn(v.dif);
      if(!isFinite(dif)) return showErr('Escribe lo que realmente tienes o la diferencia.');
      dif=Math.round(dif*100)/100;
      if(Math.abs(dif)<0.005) return showErr('No hay diferencia que ajustar: la app ya coincide con lo que tienes.');
      if(Math.abs(dif)>1e9) return showErr('Ese monto es demasiado grande.');
      if(v.fecha&&!validDate(v.fecha)) return showErr('Elige una fecha válida.');
      var o={id:d.id,monto:dif,nota:(v.nota||'').trim(),fecha:v.fecha||'',ts:d.ts||Date.now()};
      if(!mes.ajustes) mes.ajustes=[];

      untomb(mes,o.id); saveMes(); closeSheet(); render(); toast(ex?'Ajuste guardado':'Saldo ajustado');
    });
  });
}

   '<button class="btn line" data-a="edit-cashea" data-id="'+esc(c.id)+'">'+(cb?'Editar préstamo':deu?'Editar deuda':'Editar')+'</button><button class="btn ghost" data-a="close">Cerrar</button></div>';
  openSheet(h);
}

/* ---------- copia de seguridad ---------- */
async function buildBackup(){
  var all=await Store.all(), meses={};
  Object.keys(all).forEach(function(n){if(n.indexOf('m-')===0) meses[n.slice(2)]=all[n]});
  Object.keys(MES).forEach(function(k){meses[k]=MES[k]});
  Object.keys(meses).forEach(function(k){var m=normalizeMes(meses[k]); var vacio=!m.variables.length&&!m.extras.length&&!m.ahorros.length&&!m.ajustes.length&&!Object.keys(m.fijos).length&&!Object.keys(m.ingresos).some(function(k){return m.ingresos[k]}); if(vacio) delete meses[k]; else meses[k]=m});
  return {app:'cuentas-del-mes',version:3,exportado:new Date().toISOString(),config:CFG,meses:meses};
}
/* ---------- recordatorio de copia de seguridad ---------- */
function respaldoDias(){var d=prefGet('backupDias'); if(d==='0') return 0; var n=parseInt(d,10); return n>0?n:14}
function respaldoMarca(){prefSet('lastBackup',String(Date.now())); if(ready&&tab==='ajustes') render()}
function respaldoHace(){var t=Number(prefGet('lastBackup')); if(!(t>0)) return null; return Math.max(0,Math.floor((Date.now()-t)/86400000))}
function respaldoTxt(){var h=respaldoHace(); return h===null?'Todavía no has guardado ninguna copia desde este dispositivo.':'Última copia guardada: '+(h===0?'hoy':h===1?'ayer':'hace '+h+' días')+'.'}
function respaldoAviso(){
  var dias=respaldoDias(); if(!dias||!ready) return '';
  if(!Object.keys(MES).some(function(k){return mesTieneDatos(MES[k])})) return '';
  var h=respaldoHace(); if(h!==null&&h<dias) return '';
  return '<button class="notice warn" data-a="go-aj" data-v="datos"><span><b>Copia de seguridad:</b> '+(h===null?'todavía no has guardado una.':'hace '+h+(h===1?' día':' días')+' que no guardas una.')+(Store.mode==='cuenta'?'':' Tus datos viven solo en este dispositivo.')+' Toca para guardarla.</span></button>';
}

/* ---------- exportar a CSV (Excel) ---------- */
async function buildCSV(){
  await loadAllMonths();
  var sep=DS()===','?';':',';
  function num(n){return (Math.round((Number(n)||0)*100)/100).toFixed(2).replace('.',DS())}
  function q(x){x=String(x==null?'':x); return (/["\n\r]/.test(x)||x.indexOf(sep)>-1)?'"'+x.replace(/"/g,'""')+'"':x}
  var rows=[['Fecha','Mes','Tipo','Descripción','Categoría','Monto','Moneda','Equivalente en '+A(),'Comisión en '+A(),'Estado','Nota']];
  function add(k,fecha,tipo,desc,cat,monto,mon,eq,com,estado,nota){rows.push([fecha||'',k,tipo,desc||'',cat||'',monto===''?'':num(monto),mon||'',eq===''?'':num(eq),com>0?num(com):'',estado||'',nota||''])}
  Object.keys(MES).filter(function(k){return RE_YM.test(k)}).sort().forEach(function(k){
    var mes=MES[k]; if(!mes) return;
    var fs=fuentesMes(mes);
    Object.keys(mes.ingresos).forEach(function(id){var r=mes.ingresos[id]; if(!r) return; var s=fs.filter(function(x){return x.id===id})[0]; add(k,r.fecha,'Ingreso',s?s.nombre:id,'',r.monto,r.moneda,iu(r,k),0,'Recibido',r.nota)});
    mes.extras.forEach(function(x){add(k,x.fecha,'Otro ingreso',tipoById(x.tipoId).nombre,'',x.monto,x.moneda,iu(x,k),0,'Recibido',x.nota)});
    mes.ahorros.forEach(function(x){add(k,x.fecha,'Ahorro','Dinero ahorrado','',x.monto,x.moneda,iu(x,k),0,'Apartado',x.nota)});
    mes.variables.forEach(function(v){add(k,v.fecha,'Gasto variable',v.desc+(v.lugar?' · '+v.lugar:''),catById(v.catId).nombre,v.monto,v.moneda,iu(v,k),comU(v),'Pagado',v.nota)});
    if(mesTieneDatos(mes)||k===nowKey) fijosDelMes(k,mes).forEach(function(x){add(k,x.pagado?x.fechaPago:'','Gasto fijo',x.f.nombre,catById(x.f.catId).nombre,x.sinMonto?'':x.monto,x.moneda,x.sinMonto?'':cv(x.monto,x.moneda,k,x.tf,x.tu),x.com,x.pagado?'Pagado':x.sinMonto?'Sin monto':'Pendiente',x.f.nota)});
    var cs=casheaDelMes(k),pr=prestamosDelMes(k),dd=deudasDelMes(k);
    cs.ini.forEach(function(x){add(k,x.c.fecha,'Inicial de compra',x.c.desc,catById(x.c.catId).nombre,x.c.inicial,x.c.moneda,x.u-x.com,x.com,'Pagado',x.c.nota)});
    cs.cu.forEach(function(x){add(k,x.q.paid||x.q.due,'Cuota',x.c.desc+' · '+parteTxt(x.c,x.q),catById(x.c.catId).nombre,x.q.monto,x.c.moneda,x.u-x.com,x.com,x.q.paid?'Pagada':'Pendiente',x.c.nota)});
    pr.out.forEach(function(x){add(k,x.c.fecha,'Préstamo dado',x.c.desc,'',x.c.total,x.c.moneda,x.u,0,'Entregado',x.c.nota)});
    pr.ini.forEach(function(x){add(k,x.c.fecha,'Abono de préstamo',x.c.desc,'',x.c.inicial,x.c.moneda,x.u,0,'Cobrado',x.c.nota)});
    pr.cu.forEach(function(x){add(k,x.q.paid||x.q.due,'Cobro de préstamo',x.c.desc+' · '+parteTxt(x.c,x.q),'',x.q.monto,x.c.moneda,x.u,0,x.q.paid?'Cobrada':'Pendiente',x.c.nota)});
    dd.out.forEach(function(x){add(k,x.c.fecha,'Deuda recibida',x.c.desc,'',x.c.total,x.c.moneda,x.u,0,'Recibido',x.c.nota)});
    dd.ini.forEach(function(x){add(k,x.c.fecha,'Pago inicial de deuda',x.c.desc,'',x.c.inicial,x.c.moneda,x.u-x.com,x.com,'Pagado',x.c.nota)});
    dd.cu.forEach(function(x){add(k,x.q.paid||x.q.due,'Pago de deuda',x.c.desc+' · '+parteTxt(x.c,x.q),'',x.q.monto,x.c.moneda,x.u-x.com,x.com,x.q.paid?'Pagada':'Pendiente',x.c.nota)});
    (mes.ajustes||[]).forEach(function(a){add(k,a.fecha,'Ajuste de saldo',a.nota||'Ajuste de saldo','',a.monto,A(),Number(a.monto),0,'Aplicado','')});
  });
  return '\ufeff'+rows.map(function(r){return r.map(q).join(sep)}).join('\r\n');
}
async function exportCsv(){
  var data=await buildCSV(),name='cuentas-del-mes-'+ymd(new Date())+'.csv';
  if(!window.claude||!window.claude.use){
    try{
      var a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));
      a.download=name; document.body.appendChild(a);a.click();a.remove();
      toast('Archivo para Excel guardado en Descargas');
    }catch(e){showBox(data)}
    return;
  }
  try{
    var dl=await window.claude.use('downloads'); if(!dl) throw new Error('none');
    await dl.save({filename:name,data:data}); toast('Archivo para Excel listo');
  }catch(e){
    if(e&&e.code==='declined') return;
    showBox(data); toast('No se pudo guardar el archivo. Copia los datos de abajo.');
  }
}

async function restore(){
  var err=document.getElementById('restore-err'); err.hidden=true;
  var txt=document.getElementById('restore-text').value.trim(), o;
  try{ o=JSON.parse(txt) }catch(e){ err.textContent='El texto no es una copia válida.'; err.hidden=false; return }
  if(!o||o.app!=='cuentas-del-mes'||!o.config||typeof o.meses!=='object'){ err.textContent='Este archivo no es una copia de Cuentas del Mes.'; err.hidden=false; return }
  CFG=normalizeCfg(o.config); saveCfg();
  Object.keys(o.meses).forEach(function(k){ if(/^\d{4}-\d{2}$/.test(k)){ MES[k]=adoptar(k,o.meses[k]); saveMes(k) } });
  await getMes(curKey); render(); toast('Copia restaurada');
}

  'rs-stat':function(el){

    if(i>-1){if(s.length<=1){toast('Deja al menos una cifra');return} s.splice(i,1)} else s.push(id);
    CFG.resumen.stats=STAT_IDS.filter(function(x){return s.indexOf(x)>-1});saveCfg();render();
  },
  'mod-toggle':async function(el){
    var k=el.dataset.k,on=CFG.mods[k]!==false;
    if(on){
      var msg='';
      if(k==='cuotas'&&CFG.cashea.some(function(c){return !esCobro(c)&&!esDeuda(c)})) msg='Tienes compras a cuotas registradas. Elimínalas para ocultar esta función.';
      if(k==='prestamos'&&CFG.cashea.some(esCobro)) msg='Tienes préstamos registrados. Elimínalos para ocultar esta función.';
      if(k==='deudas'&&CFG.cashea.some(esDeuda)) msg='Tienes deudas registradas. Elimínalas para ocultar esta función.';
      if(!msg&&(k==='ahorro'||k==='extras')){
        await loadAllMonths();
        var lista=k==='ahorro'?'ahorros':'extras';
        if(Object.keys(MES).some(function(m){return MES[m][lista].length>0})) msg=k==='ahorro'?'Tienes ahorros registrados en algún mes. Elimínalos para ocultar esta función.':'Tienes otros ingresos registrados en algún mes. Elimínalos para ocultar esta función.';
      }
      if(msg){toast(msg);render();return}
    }
    CFG.mods[k]=!on;saveCfg();render();
  },
  'new-fuente':function(){sheetFuente()},
  fuente:function(el){sheetFuente(el.dataset.id)},

  'fuente-preset':function(el){confirmTap(el,'Toca de nuevo para reemplazar tus cobros',function(){
    var def=PRESETS_COBRO[el.dataset.v]; if(!def) return;
    var old=CFG.fuentes;
    CFG.fuentes=def.map(function(x,i){var pv=old[i];return mkFuente(pv?pv.id:'f'+uid(),x[0],x[1],x[2],{horas:pv?pv.horas:false})});
    old.forEach(function(o){if(!CFG.fuentes.some(function(n){return n.id===o.id})) tomb(CFG,o.id)});
    CFG.setup=true;saveCfg();render();toast('Cobros actualizados');
  })},
  'cat-up':function(el){if(mover(CFG.categorias,el.dataset.id,-1)){saveCfg();render()}},
  'cat-down':function(el){if(mover(CFG.categorias,el.dataset.id,1)){saveCfg();render()}},
  'txt-reset':function(el){confirmTap(el,'Toca de nuevo para restablecer',function(){CFG.txt={};saveCfg();render();toast('Textos originales')})},
  'cuar-retry':function(){
    var rec=0,rest=[];
    (CFG.cuarentena||[]).forEach(function(x){
      var r=normCashea(x);
      if(!r&&(!x.tipo||x.tipo==='cashea')) r=normCashea(Object.assign({},x,{tipo:'partes'}));
      if(r){ if(!CFG.cashea.some(function(c){return c.id===r.id})){CFG.cashea.push(r);rec++} }
      else rest.push(x);
    });
    CFG.cuarentena=rest; saveCfg(); render();
    toast(rec?rec+(rec===1?' registro recuperado':' registros recuperados'):'No se pudo recuperar ninguno');
  },

  'cuar-del':function(el){confirmTap(el,'Toca de nuevo para descartar',function(){(CFG.cuarentena||[]).forEach(function(x){if(x&&x.id!=null) tomb(CFG,x.id)});CFG.cuarentena=[];saveCfg();render();toast('Registros descartados')})},
  'export-file':function(){exportFile()},

async function go(key){
  curKey=key;
  await Promise.all([getMes(key),getMes(addMonths(key,-1))]);
  if(modo==='anio'&&tab==='resumen') await ensureYear(key.slice(0,4));
  render();window.scrollTo(0,0);
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]'); if(!el) return;
  var fn=H[el.dataset.a]; if(fn) fn(el,e);
});
function tasaEj(f){var ej=document.getElementById('tasa-ej'); if(ej) ej.innerHTML='50 '+esc(B())+' = '+fmt(50*f)+' '+esc(A())+' &nbsp;·&nbsp; 45 '+esc(A())+' = '+fmt(45/f)+' '+esc(B())}
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='q'){busq=el.value;renderLista()}
  if(el.id==='ui-color'){var hx=String(el.value||'').toUpperCase(); if(/^#[0-9A-F]{6}$/.test(hx)){CFG.ui.acento=hx;applyUI()}}
  if(el.id==='set-pct'){
    var p=parseRate(el.value);
    var a1=document.getElementById('set-tu'),b1=document.getElementById('set-tb'); if(a1) a1.value=''; if(b1) b1.value='';
    if(p>=0&&p<=90) tasaEj(1-p/100);
  }
  if(el.id==='set-tu'||el.id==='set-tb'){
    var tu=parseRate(document.getElementById('set-tu').value),tb=parseRate(document.getElementById('set-tb').value);
    if(tu>0&&tb>0&&tb/tu>0.05&&tb/tu<=1.5){document.getElementById('set-pct').value=pctStr(tb/tu);tasaEj(tb/tu)}
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='restore-file'&&el.files&&el.files[0]){
    var rd=new FileReader(); rd.onload=function(){document.getElementById('restore-text').value=String(rd.result||'')}; rd.readAsText(el.files[0]);
    return;
  }
  if(el.id==='ui-color'){var hx=String(el.value||'').toUpperCase(); if(/^#[0-9A-F]{6}$/.test(hx)){CFG.ui.acento=hx;saveCfg();render()} return}
  if(!el.dataset||!el.dataset.set) return;
  if(el.dataset.set==='txt'){
    var tk=el.dataset.k,tv=el.value.trim().slice(0,40);
    if(tv&&tv!==DEF_TXT[tk]) CFG.txt[tk]=tv; else delete CFG.txt[tk];
    saveCfg(); applyUI(); toast('Guardado'); renderSiLibre(); return;
  }
  if(el.dataset.set==='mon-a'||el.dataset.set==='mon-b'){
    var mk=el.dataset.set==='mon-a'?'a':'b',mv=el.value.trim().slice(0,10);
    if(!mv){toast('Escribe un nombre para la moneda');el.value=CFG.mon[mk];return}
    CFG.mon[mk]=mv; saveCfg(); toast('Guardado'); renderSiLibre(); return;
  }
  if(el.dataset.set==='backup-dias'){
    prefSet('backupDias',String(parseInt(el.value,10)||0)); toast(parseInt(el.value,10)>0?'Te lo recordaré cada '+parseInt(el.value,10)+' días':'Sin recordatorio de copia'); return;
  }
  if(el.dataset.set==='com'){
    var cmv2=parseRate(el.value);
    if(!(cmv2>=0&&cmv2<=1000)){toast('Escribe un monto de 0 en adelante');el.value=numIn(comActual());return}
    CFG.comision.monto=Math.round(cmv2*10000)/10000; saveCfg(); el.value=numIn(CFG.comision.monto);
    toast(cmv2>0?'Comisión guardada. Vale solo para lo que registres desde ahora.':'Comisión desactivada para lo nuevo');
    return;
  }
  if(el.dataset.set==='arr-desde'){
    if(!CFG.arr) CFG.arr={on:true,desde:''};
    CFG.arr.desde=RE_YM.test(el.value)?el.value:'';
    saveCfg(); render();
    toast(CFG.arr.desde?'Se suma desde '+monthLabel(CFG.arr.desde).toLowerCase():'Inicio automático');
    return;
  }
  if(el.dataset.set==='cdias'){
    var cd=parseInt(el.value,10);
    if(!(cd>=1&&cd<=60)){toast('Usa entre 1 y 60 días');el.value=CFG.casheaDias;return}
    CFG.casheaDias=cd; saveCfg(); toast('Días entre cuotas guardados');
  }
  if(el.dataset.set==='meta'){
    var mv=parseNum(el.value);
    if(el.value.trim()===''||mv===0){CFG.metaAhorro=0;el.value='';saveCfg();toast('Meta quitada');return}
    if(!(mv>0)){toast('Escribe un monto mayor que cero');el.value=CFG.metaAhorro>0?numIn(CFG.metaAhorro):'';return}
    CFG.metaAhorro=mv; saveCfg(); toast('Meta guardada');
  }
});

Sync.onChange=function(){
  paintStatus();
  var c=document.getElementById('sync-card'); if(c&&overlay.hidden) c.innerHTML=syncInner();
};

/* ---------- arranque ---------- */
(async function boot(){
  cargarBase();
  render();
  await Store.init();
  var c=await Store.get('config'); if(c) CFG=normalizeCfg(c);
  await Promise.all([getMes(curKey),getMes(addMonths(curKey,-1))]);
  /* se cargan todos los meses para poder sumar lo que quedó en cada uno de los anteriores */
  try{await loadAllMonths()}catch(e){}
  ready=true; render();
  Sync.start();
  try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist()}catch(e){}
})();
})();
